name: Gerar executavel Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Gerar o .exe
        run: pyinstaller --onefile --windowed --name "Calculadora Preco Mir4" CalculadoraPrecoMir4.py

      - name: Publicar o .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Preco-Mir4
          path: dist/*.exe

      - name: Criar Release com o .exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
